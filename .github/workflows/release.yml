name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-linux-tarball:
    name: Linux Tarball (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libxkbcommon-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tarball (install.sh + engine bundle)
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -1)
          bash Release/linux/build-tarball.sh <<< "$VERSION"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Release/artifacts/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
