[package]
name = "lindex"
version = "0.2.0"
edition = "2021"
authors = ["BeetleBot <nirmal@iyal.ink>"]
description = "Samsung DeX client for Linux"
license = "MIT"
readme = "README.md"
repository = "https://github.com/BeetleBot/LinDEX"
homepage = "https://github.com/BeetleBot/LinDEX"
keywords = ["samsung", "dex", "android", "display"]
categories = ["command-line-utilities"]
exclude = ["dist/**", "scripts/**", "*.AppImage"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
regex = "1.10"
dirs = "5.0"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
